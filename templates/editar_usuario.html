{% extends "base.html" %}
{% block titulo %}Editar Usuario{% endblock %}
{% block contenido %}

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6"> <!-- ajusta el ancho aquí -->
            <h2 class="mb-3 text-center">Editar Usuario</h2>
            <form method="POST" class="shadow p-4 rounded bg-light">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario[1] }}" required>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" value="{{ usuario[2] }}" required>
                </div>

                <div class="mb-3">
                    <label for="carrera" class="form-label">Carrera</label>
                    <input type="text" class="form-control" id="carrera" name="carrera" value="{{ usuario[3] }}" required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <!-- Campo deshabilitado -->
                    <input type="email" class="form-control" id="correo" name="correo" value="{{ usuario[4] }}" disabled>
                    <small class="form-text text-muted">El correo no se puede modificar.</small>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" value="{{ usuario[5] }}" required>
                </div>

                <div class="mb-3">
                    <label for="estatus" class="form-label">Estatus</label>
                    <select class="form-select" id="estatus" name="estatus" required>
                        <option value="alumno" {% if usuario[6] == 'alumno' %}selected{% endif %}>Alumno</option>
                        <option value="vendedor" {% if usuario[6] == 'vendedor' %}selected{% endif %}>Vendedor</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a href="{{ url_for('listar_usuarios') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
